name: Build VPS image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - start.sh
      - front_proxy.py
      - model_proxy.py
      - configure_9router.js
      - patch_hermes_streaming.py
      - backup_sync.py
      - .github/workflows/build-vps-image.yml

concurrency:
  group: hermes-vps-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the VPS image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hermes-telegram-cloud:latest
            ghcr.io/${{ github.repository_owner }}/hermes-telegram-cloud:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
